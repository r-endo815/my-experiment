<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ミュラー・リヤー錯視 調整法実験</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- jsPsych 7.3 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jspsych@7.3.0/css/jspsych.css">
  <!-- Tailwind CSS (for modern UI layout) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- jsPsych 7.3 Core and Plugins (Using stable jsDelivr browser bundles) -->
  <script src="https://cdn.jsdelivr.net/npm/jspsych@7.3.0/dist/index.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@jspsych/plugin-canvas-slider-response@1.1.2/dist/index.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@jspsych/plugin-html-keyboard-response@1.1.2/dist/index.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@jspsych/plugin-html-button-response@1.1.2/dist/index.browser.min.js"></script>
  
  <style>
    /* 画面全体を上下左右中央に配置するスタイル */
    body {
      background-color: #f3f4f6; /* Slate 100 */
      color: #1f2937; /* Gray 800 */
      font-family: 'Helvetica Neue', Arial, sans-serif;
    }
    .jspsych-content-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      width: 100%;
    }
    .jspsych-content {
      max-width: 800px;
      width: 100%;
      background: #ffffff;
      padding: 2.5rem;
      border-radius: 1rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    }
    /* スライダーやボタンのカスタムスタイル */
    .jspsych-sliders-response-container {
      margin-top: 20px;
    }
    input[type=range] {
      width: 100%;
      max-width: 450px;
      height: 8px;
      border-radius: 5px;
      outline: none;
    }
    /* ボタンのスタイル統一 */
    .jspsych-btn {
      background-color: #3b82f6 !important; /* Blue 500 */
      color: white !important;
      font-weight: 600 !important;
      padding: 0.5rem 1.5rem !important;
      border-radius: 0.375rem !important;
      border: none !important;
      transition: background-color 0.2s !important;
    }
    .jspsych-btn:hover {
      background-color: #2563eb !important; /* Blue 600 */
    }
    /* 無効化されたボタンのスタイル */
    .jspsych-btn:disabled {
      background-color: #9ca3af !important; /* Gray 400 */
      cursor: not-allowed !important;
      opacity: 0.6 !important;
    }
  </style>
</head>
<body>

  <div id="jspsych-target"></div>

  <script>
    // 送信用GASエンドポイントURL (ご自身のGASウェブアプリURL)
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbxSIbbjVgTza09W8omGwrvAq_BCthVQ77_1lSLJih3p9zrXJo3vhOPzxl0sd__DLaZAlA/exec';

    // jsPsychの初期化
    const jsPsych = initJsPsych({
      display_element: 'jspsych-target',
      on_finish: function() {
        // 実験終了後に結果データを集計
        const rawTrials = jsPsych.data.get().filter({task: 'response'}).values();
        const participantId = jsPsych.data.get().select('participant_id').values[0] || 'Unknown';
        const deviceType = jsPsych.data.get().select('device_type').values[0] || '未回答';
        const nowStr = new Date().toLocaleString('ja-JP');

        // 指定のデータ構造にマッピング（スプレッドシートの列と完全同期できるように調整）
        const formattedData = rawTrials.map((trial, idx) => {
          const pseVal = parseInt(trial.response);
          const errorVal = pseVal - 200; // 標準刺激200px固定からのズレ
          return {
            subject_id: participantId,         // 参加者ID
            device_type: deviceType,           // 使用機材
            timestamp: nowStr,                 // 日時
            trial_num: idx + 1,                // 試行番号
            angle: trial.angle,                // 角度 (度)
            wing_length: trial.wing_length,    // 羽の長さ (px)
            std_stimulus: 200,                 // 標準刺激 (px)
            pse: pseVal,                       // 調整後(PSE) (px)
            error_amount: errorVal             // 誤差 (px)
          };
        });

        // 描画ターゲット要素を取得
        const contentEl = document.querySelector('.jspsych-content');

        // 送信処理関数 (リトライ指数バックオフ付き)
        function sendToGAS(retriesLeft = 3, delay = 1000) {
          contentEl.innerHTML = `
            <div class="text-center py-8">
              <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mb-4"></div>
              <h2 class="text-xl font-bold text-gray-800 mb-2">データを保存中</h2>
              <p class="text-gray-600 text-sm">実験結果データをスプレッドシートに送信して整理しています...</p>
            </div>
          `;

          // GAS Web App へのデータのPOST送信 (CORS制限を安全に回避するために text/plain でJSON文字列を送る手法がGAS連携の鉄板です)
          fetch(GAS_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: {
              'Content-Type': 'text/plain'
            },
            body: JSON.stringify(formattedData)
          })
          .then(() => {
            // 送信完了画面を描画
            renderFinalScreen(true);
          })
          .catch(error => {
            if (retriesLeft > 0) {
              // エラー時の自動リトライ
              setTimeout(() => {
                sendToGAS(retriesLeft - 1, delay * 2);
              }, delay);
            } else {
              // 最終的なエラー時の表示
              renderFinalScreen(false, error.message || 'ネットワーク接続に問題があるか、GASのサーバー設定を確認してください。');
            }
          });
        }

        // 最終画面描画処理
        function renderFinalScreen(isSuccess, errorMessage = '') {
          let statusBanner = '';
          if (isSuccess) {
            statusBanner = `
              <div class="bg-green-50 border-l-4 border-green-500 p-4 mb-6 rounded text-left">
                <div class="flex items-center">
                  <div class="flex-shrink-0">
                    <svg class="h-5 w-5 text-green-500" viewBox="0 0 20 20" fill="currentColor">
                      <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
                    </svg>
                  </div>
                  <div class="ml-3">
                    <p class="text-sm font-medium text-green-800">
                      スプレッドシートへの自動反映が完了しました！そのままブラウザを閉じて構いません。
                    </p>
                  </div>
                </div>
              </div>
            `;
          } else {
            statusBanner = `
              <div class="bg-red-50 border-l-4 border-red-500 p-4 mb-6 rounded text-left">
                <div class="flex flex-col">
                  <div class="flex items-center">
                    <div class="flex-shrink-0">
                      <svg class="h-5 w-5 text-red-500" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/>
                      </svg>
                    </div>
                    <div class="ml-3">
                      <p class="text-sm font-medium text-red-800">
                        データの送信に失敗しました。
                      </p>
                      <p class="text-xs text-red-700 mt-1">理由: ${errorMessage}</p>
                    </div>
                  </div>
                  <div class="mt-3 flex space-x-3 ml-8">
                    <button id="retry-btn" class="text-xs bg-red-600 hover:bg-red-700 text-white font-semibold py-1.5 px-3.5 rounded transition">
                      もう一度送信する
                    </button>
                  </div>
                </div>
              </div>
            `;
          }

          let resultHtml = `
            <div class="text-center">
              <h2 class="text-2xl font-bold mb-2 text-gray-800">実験終了</h2>
              <p class="text-md font-semibold text-blue-600 mb-6">参加者ID: ${participantId} &nbsp;|&nbsp; 使用機材: ${deviceType}</p>
              
              ${statusBanner}

              <p class="mb-6 text-gray-600">ご協力ありがとうございました。以下があなたの実験データです。</p>
              <div class="overflow-x-auto">
                <table class="min-w-full bg-white border border-gray-200 mb-6">
                  <thead>
                    <tr class="bg-gray-100 border-b">
                      <th class="py-2 px-4 text-sm font-semibold text-gray-700">試行</th>
                      <th class="py-2 px-4 text-sm font-semibold text-gray-700">参加者ID</th>
                      <th class="py-2 px-4 text-sm font-semibold text-gray-700">角度 (度)</th>
                      <th class="py-2 px-4 text-sm font-semibold text-gray-700">羽の長さ (px)</th>
                      <th class="py-2 px-4 text-sm font-semibold text-gray-700">標準刺激 (px)</th>
                      <th class="py-2 px-4 text-sm font-semibold text-gray-700">調整後(PSE) (px)</th>
                      <th class="py-2 px-4 text-sm font-semibold text-gray-700">誤差 (px)</th>
                    </tr>
                  </thead>
                  <tbody>
          `;

          let count = 1;
          formattedData.forEach(function(row) {
            resultHtml += `
              <tr class="border-b hover:bg-gray-50">
                <td class="py-2 px-4 text-sm text-gray-600">${count++}</td>
                <td class="py-2 px-4 text-sm text-gray-600 font-mono">${row.subject_id}</td>
                <td class="py-2 px-4 text-sm text-gray-600">${row.angle}</td>
                <td class="py-2 px-4 text-sm text-gray-600">${row.wing_length}</td>
                <td class="py-2 px-4 text-sm text-gray-600">${row.std_stimulus}</td>
                <td class="py-2 px-4 text-sm text-gray-600 font-semibold">${row.pse}</td>
                <td class="py-2 px-4 text-sm ${row.error_amount >= 0 ? 'text-red-500' : 'text-blue-500'} font-semibold">
                  ${row.error_amount > 0 ? '+' : ''}${row.error_amount}
                </td>
              </tr>
            `;
          });

          resultHtml += `
                  </tbody>
                </table>
              </div>
              <p class="text-sm text-gray-500 mb-6">※ 調整後の長さ(PSE)が200pxに近いほど、正確に調整できていることを示します。</p>
              <button onclick="window.location.reload();" class="jspsych-btn">もう一度行う</button>
            </div>
          `;

          contentEl.innerHTML = resultHtml;

          // 手動リトライボタン用のハンドラ設定
          const retryBtn = document.getElementById('retry-btn');
          if (retryBtn) {
            retryBtn.addEventListener('click', function() {
              sendToGAS();
            });
          }
        }

        // 初期ロード完了時の即時データ送信開始
        sendToGAS();
      }
    });

    // 入力・選択値を一時保持するグローバル変数（DOM破棄時のエラー対策）
    let tempParticipantId = "Unknown";
    let tempDeviceType = "パソコン"; // デフォルト

    // タイムラインの作成
    const timeline = [];

    // 0. 参加者ID入力画面
    const participant_id_screen = {
      type: jsPsychHtmlButtonResponse,
      stimulus: `
        <div class="text-center">
          <h1 class="text-2xl font-bold mb-6 text-blue-600">実験開始</h1>
          <p class="mb-4 text-gray-600">実験を始める前に、参加者ID（例：半角英数字、出席番号など）を入力してください。</p>
          <div class="mb-6">
            <input type="text" id="participant-id" 
                   class="px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 w-64 text-center font-mono text-lg" 
                   placeholder="IDを入力してください" autocomplete="off" required>
          </div>
        </div>
      `,
      choices: ['次へ'],
      button_html: '<button class="jspsych-btn" id="submit-id-btn">%choice%</button>',
      on_load: function() {
        const btn = document.getElementById('submit-id-btn');
        const input = document.getElementById('participant-id');
        
        // 初期状態はボタンを無効化
        btn.disabled = true;
        
        // 入力欄に文字が入っているか監視
        input.addEventListener('input', function() {
          const val = input.value.trim();
          if (val !== '') {
            btn.disabled = false;
            tempParticipantId = val; // 入力値を一時退避
          } else {
            btn.disabled = true;
          }
        });
        
        // 入力欄にフォーカスを当てる
        input.focus();
      },
      on_finish: function() {
        // IDを全体のプロパティに追加
        jsPsych.data.addProperties({ participant_id: tempParticipantId });
      }
    };
    timeline.push(participant_id_screen);

    // 0.5 使用機材選択画面（「スクリーンショット 2026-06-04 130705.png」を忠実に再現）
    const device_select_screen = {
      type: jsPsychHtmlButtonResponse,
      stimulus: `
        <div class="text-center py-6">
          <h2 class="text-xl font-medium mb-12 text-gray-900 leading-normal">
            現在、実験に使用している機材を選択してください<span class="text-red-500 ml-1 font-bold">*</span>
          </h2>
          <div class="flex justify-center items-center space-x-10 mb-14 text-lg">
            <label class="inline-flex items-center cursor-pointer select-none">
              <input type="radio" name="device" value="パソコン" 
                     class="w-5 h-5 text-blue-600 border-gray-300 focus:ring-blue-500 accent-blue-600" checked>
              <span class="ml-2.5 text-gray-800">パソコン</span>
            </label>
            <label class="inline-flex items-center cursor-pointer select-none">
              <input type="radio" name="device" value="スマホ" 
                     class="w-5 h-5 text-blue-600 border-gray-300 focus:ring-blue-500 accent-blue-600">
              <span class="ml-2.5 text-gray-800">スマホ</span>
            </label>
            <label class="inline-flex items-center cursor-pointer select-none">
              <input type="radio" name="device" value="タブレット" 
                     class="w-5 h-5 text-blue-600 border-gray-300 focus:ring-blue-500 accent-blue-600">
              <span class="ml-2.5 text-gray-800">タブレット</span>
            </label>
          </div>
        </div>
      `,
      choices: ['次へ'],
      button_html: '<div class="flex justify-center"><button class="jspsych-btn px-8 py-2.5" id="submit-device-btn">%choice%</button></div>',
      on_load: function() {
        const radios = document.querySelectorAll('input[name="device"]');
        
        // ラジオボタンの変更イベントを監視し、現在の選択値を退避
        radios.forEach(radio => {
          radio.addEventListener('change', function() {
            if (this.checked) {
              tempDeviceType = this.value;
            }
          });
        });
      },
      on_finish: function() {
        // 使用機材の選択情報を全体のプロパティに追加
        jsPsych.data.addProperties({ device_type: tempDeviceType });
      }
    };
    timeline.push(device_select_screen);

    // 1. 教示画面
    const instruction = {
      type: jsPsychHtmlKeyboardResponse,
      stimulus: `
        <div class="text-left leading-relaxed">
          <h1 class="text-2xl font-bold mb-4 text-center text-blue-600">ミュラー・リヤー錯視 調整法実験</h1>
          <p class="mb-4">この実験では、視覚的な長さの判断に関するテストを行います。</p>
          <p class="mb-4">画面中央に、上下に2本の線が提示されます。</p>
          <ul class="list-disc list-inside mb-4 space-y-2 text-gray-700">
            <li><strong>上の線 (標準刺激):</strong> 長さは常に固定（200px）です。羽は<b>内向き</b>（&gt;───&lt; の形）に開いています。</li>
            <li><strong>下の線 (比較刺激):</strong> 長さをスライダーで変化させることができます。羽は<b>外向き</b>（&lt;───&gt; の形）に開いています。</li>
          </ul>
          <p class="mb-4 font-semibold text-red-600">あなたの課題：</p>
          <p class="mb-6 pl-4 border-l-4 border-red-500 text-gray-700">
            下のスライダーをドラッグして動かし、<strong>「下の線の長さ」が「上の線の長さ（主軸の横棒部分）」と【主観的に同じ長さ】に見えるように調整してください。</strong><br>
            調整が完了したら、スライダーの下に表示される「決定」ボタンをクリックして次の試行に進んでください。
          </p>
          <div class="text-center mt-8">
            <span class="bg-gray-100 text-gray-800 text-sm font-semibold px-4 py-2 rounded">
              スペースキーを押すと実験を開始します
            </span>
          </div>
        </div>
      `,
      choices: [' ']
    };
    timeline.push(instruction);

    // 要因計画の定義
    // 独立変数: 角度(15度, 75度) × 羽の長さ(20px, 50px)
    const angles = [15, 75];
    const featherLengths = [20, 50];
    const repetitions = 3; // 各条件を3回ずつ

    // 試行リストの作成
    let trials_design = [];
    for (let a of angles) {
      for (let f of featherLengths) {
        for (let r = 0; r < repetitions; r++) {
          trials_design.push({
            angle: a,
            feather_length: f
          });
        }
      }
    }

    // 試行リストをランダムシャッフル
    trials_design = jsPsych.randomization.shuffle(trials_design);

    // 各試行における描画処理
    // 引数として現在のスライダーの値（刺激の長さ）を受け取り、canvasに再描画する
    function drawMullerLyer(canvas, sliderValue, angle, featherLength) {
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const centerX = canvas.width / 2;
      
      // 共通の設定
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#1f2937'; // ダークグレー

      // ラジアン変換
      const rad = angle * Math.PI / 180;
      const cosVal = Math.cos(rad);
      const sinVal = Math.sin(rad);

      // ==========================================
      // 1. 上半分：標準刺激 (内向き羽・200px固定)
      //    形状： >──────────< (折り返し)
      // ==========================================
      const topY = 100;
      const stdLength = 200;
      const stdStartX = centerX - (stdLength / 2);
      const stdEndX = centerX + (stdLength / 2);

      // 主線
      ctx.beginPath();
      ctx.moveTo(stdStartX, topY);
      ctx.lineTo(stdEndX, topY);
      ctx.stroke();

      // 内向きの羽 (先端から内側に向けて伸ばす)
      // 左端 (stdStartX)：右(内側)に向けて羽を伸ばす
      ctx.beginPath();
      ctx.moveTo(stdStartX, topY);
      ctx.lineTo(stdStartX + featherLength * cosVal, topY - featherLength * sinVal);
      ctx.moveTo(stdStartX, topY);
      ctx.lineTo(stdStartX + featherLength * cosVal, topY + featherLength * sinVal);
      
      // 右端 (stdEndX)：左(内側)に向けて羽を伸ばす
      ctx.moveTo(stdEndX, topY);
      ctx.lineTo(stdEndX - featherLength * cosVal, topY - featherLength * sinVal);
      ctx.moveTo(stdEndX, topY);
      ctx.lineTo(stdEndX - featherLength * cosVal, topY + featherLength * sinVal);
      ctx.stroke();

      // ==========================================
      // 2. 下半分：比較刺激 (外向き羽・可変[sliderValue])
      //    形状： <──────────> (広がり)
      // ==========================================
      const bottomY = 250;
      const compLength = sliderValue; // スライダーの値（リアルタイム）
      const compStartX = centerX - (compLength / 2);
      const compEndX = centerX + (compLength / 2);

      // 主線
      ctx.beginPath();
      ctx.moveTo(compStartX, bottomY);
      ctx.lineTo(compEndX, bottomY);
      ctx.stroke();

      // 外向きの羽 (先端から外側に向けて伸ばす)
      // 左端 (compStartX)：左(外側)に向けて羽を伸ばす
      ctx.beginPath();
      ctx.moveTo(compStartX, bottomY);
      ctx.lineTo(compStartX - featherLength * cosVal, bottomY - featherLength * sinVal);
      ctx.moveTo(compStartX, bottomY);
      ctx.lineTo(compStartX - featherLength * cosVal, bottomY + featherLength * sinVal);
      
      // 右端 (compEndX)：右(外側)に向けて羽を伸ばす
      ctx.moveTo(compEndX, bottomY);
      ctx.lineTo(compEndX + featherLength * cosVal, bottomY - featherLength * sinVal);
      ctx.moveTo(compEndX, bottomY);
      ctx.lineTo(compEndX + featherLength * cosVal, bottomY + featherLength * sinVal);
      ctx.stroke();
    }

    // 試行の作成
    const totalTrials = trials_design.length;

    trials_design.forEach((config, index) => {
      // 初期値を 100px 〜 300px の間でランダムに設定
      const initialValue = Math.floor(Math.random() * (300 - 100 + 1)) + 100;

      const trial = {
        type: jsPsychCanvasSliderResponse,
        // canvas上に図形を描画する関数
        stimulus: function(c) {
          // 最初の描画（初期値）
          drawMullerLyer(c, initialValue, config.angle, config.feather_length);
        },
        // canvasのサイズ設定
        canvas_size: [350, 600], // [高さ, 幅]
        // スライダーの設定
        min: 50,
        max: 350,
        slider_start: initialValue,
        step: 1,
        labels: ['50px', '350px'],
        button_label: '決定',
        // 試行情報の表示
        prompt: `<div class="text-sm font-bold text-gray-500 mb-2">試行 ${index + 1} / ${totalTrials}</div>`,
        // スライダーの値が変更されたら、リアルタイムに再描画を行う
        on_load: function() {
          const canvas = document.getElementById('jspsych-canvas-stimulus');
          const slider = document.querySelector('input[type="range"]');
          
          if (slider && canvas) {
            slider.addEventListener('input', function() {
              const currentValue = parseInt(slider.value);
              drawMullerLyer(canvas, currentValue, config.angle, config.feather_length);
            });
          }
        },
        // データの保存 (GASデータ形式に完全に紐づけ可能な名称で格納)
        data: {
          task: 'response',
          trial_index_all: index + 1,
          angle: config.angle,
          wing_length: config.feather_length,
          feather_length: config.feather_length,
          initial_value: initialValue
        }
      };

      timeline.push(trial);
    });

    // 実験の実行
    jsPsych.run(timeline);
  </script>
</body>
</html>
