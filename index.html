<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心理学実験室</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #f3f4f6; /* 薄いグレー */
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
        }

        .container {
            text-align: center;
            padding: 2rem;
            background-color: white;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        h1 {
            font-size: 3rem;
            font-weight: bold;
            color: #1f2937;
            margin-bottom: 2rem;
        }

        .start-button {
            background-color: #2563eb; /* 青いボタン */
            color: white;
            padding: 1rem 2.5rem;
            font-size: 1.25rem;
            font-weight: 600;
            border-radius: 0.5rem;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .start-button:hover {
            background-color: #1d4ed8;
        }

        .start-button:active {
            transform: scale(0.98);
        }

        /* カスタムアラート（alert()の代わり） */
        #custom-alert {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 2rem;
            border-radius: 0.75rem;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
            z-index: 1000;
            text-align: center;
            min-width: 300px;
        }

        #overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            z-index: 999;
        }

        .close-btn {
            margin-top: 1.5rem;
            padding: 0.5rem 1.5rem;
            background: #4b5563;
            color: white;
            border-radius: 0.375rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>心理学実験室へようこそ</h1>
        <button class="start-button" onclick="showAlert()">実験を開始する</button>
    </div>

    <!-- カスタムアラートの構造 -->
    <div id="overlay"></div>
    <div id="custom-alert">
        <p id="alert-message" style="font-size: 1.5rem; color: #111827;">Hello World!</p>
        <button class="close-btn" onclick="hideAlert()">閉じる</button>
    </div>

    <script>
        // アラートを表示する関数
        function showAlert() {
            document.getElementById('overlay').style.display = 'block';
            document.getElementById('custom-alert').style.display = 'block';
        }

        // アラートを閉じる関数
        function hideAlert() {
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('custom-alert').style.display = 'none';
        }

        // 背景クリックでも閉じられるように設定
        document.getElementById('overlay').onclick = hideAlert;
    </script>
</body>
</html>
